<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  overflow-x:hidden;
  transition:0.2s;
}

h2{
  margin:15px 0 10px;
}

button{
  padding:12px 16px;
  margin:5px;
  font-size:15px;
  border:none;
  border-radius:12px;
  background:#222;
  color:white;
}

#reader-container{

  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:24px;

  background:#000;

  margin-top:10px;
}

#reader{

  width:100%;

  transition:0.15s;
}


/* ================= SCAN BOX ================= */

.scan-box{

  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:85%;
  height:200px;

  border:2px solid rgba(255,255,255,0.18);

  border-radius:22px;

  z-index:999;

  pointer-events:none;

  transition:0.15s;
}


/* 4 CORNERS */

.corner{

  position:absolute;

  width:45px;
  height:45px;

  border-color:#00ff99;

  border-style:solid;

  z-index:1000;
}

.tl{
  top:-2px;
  left:-2px;
  border-width:5px 0 0 5px;
  border-radius:20px 0 0 0;
}

.tr{
  top:-2px;
  right:-2px;
  border-width:5px 5px 0 0;
  border-radius:0 20px 0 0;
}

.bl{
  bottom:-2px;
  left:-2px;
  border-width:0 0 5px 5px;
  border-radius:0 0 0 20px;
}

.br{
  bottom:-2px;
  right:-2px;
  border-width:0 5px 5px 0;
  border-radius:0 0 20px 0;
}


/* ================= LASER ================= */

.scan-line{

  position:absolute;

  left:50%;

  transform:translateX(-50%);

  width:82%;

  height:3px;

  background:#ff0000;

  box-shadow:
    0 0 10px #ff0000,
    0 0 20px #ff0000,
    0 0 40px #ff0000;

  z-index:1001;

  border-radius:20px;

  animation:laser 2s linear infinite;
}

@keyframes laser{

  0%{
    top:22%;
  }

  50%{
    top:72%;
  }

  100%{
    top:22%;
  }
}


/* ================= FOCUS EFFECT ================= */

.focus-effect{

  animation:focusPulse .25s ease;
}

@keyframes focusPulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

  100%{
    transform:scale(1);
  }
}


/* ================= RESULT ================= */

#result{
  font-size:24px;
  padding:18px;
  font-weight:bold;
  min-height:90px;
}


/* ================= POPUP ================= */

#popup{

  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  background:#111;

  padding:30px;

  border-radius:24px;

  width:82%;

  z-index:9999;

  font-size:28px;

  font-weight:bold;

  display:none;

  box-shadow:0 0 30px #000;
}

.popup-success{
  border:3px solid #00ff99;
  color:#00ff99;
}

.popup-error{
  border:3px solid #ff4444;
  color:#ff4444;
}

.show{
  animation:pop .18s ease;
}

@keyframes pop{

  from{
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
  }

  to{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}

</style>
</head>

<body>

<h2>📷 QR Điểm Danh PRO</h2>

<button onclick="enableSound()">
🔊 Bật âm thanh
</button>

<button onclick="switchCamera()">
🔄 Camera
</button>

<button onclick="toggleFlash()">
🔦 Flash
</button>

<div id="reader-container">

  <div id="reader"></div>

  <div class="scan-box" id="scanBox">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

  </div>

  <div class="scan-line"></div>

</div>

<div id="result">
📷 Sẵn sàng quét
</div>

<div id="popup"></div>

<script>

const result =
  document.getElementById("result");

const popup =
  document.getElementById("popup");

const reader =
  document.getElementById("reader");

const scanBox =
  document.getElementById("scanBox");

const successAudio = new Audio(
  "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
);

const errorAudio = new Audio(
  "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

successAudio.preload = "auto";
errorAudio.preload = "auto";

successAudio.load();
errorAudio.load();

let soundEnabled = false;

let html5QrCode =
  new Html5Qrcode("reader");

let cameras = [];

let cameraIndex = 0;

let scanning = true;

let flashOn = false;

let cameraStarted = false;

let lastCode = "";

let lastTime = 0;


/* ================= SOUND ================= */

async function enableSound(){

  try{

    await successAudio.play();

    successAudio.pause();

    successAudio.currentTime = 0;

    await errorAudio.play();

    errorAudio.pause();

    errorAudio.currentTime = 0;

    soundEnabled = true;

    navigator.vibrate?.([200,100,200]);

    alert("✅ Đã bật âm thanh & rung");

  }catch(err){

    console.log(err);

    alert("❌ Browser chặn âm thanh");
  }
}


/* ================= POPUP ================= */

function showPopup(html, ok=true){

  popup.style.display = "block";

  popup.className =
    ok
    ? "popup-success"
    : "popup-error";

  popup.classList.remove("show");

  void popup.offsetWidth;

  popup.classList.add("show");

  popup.innerHTML = html;
}

function hidePopup(){

  popup.style.display = "none";
}


/* ================= EFFECTS ================= */

function successEffect(){

  scanBox.style.borderColor =
    "#00ff99";

  reader.classList.add("focus-effect");

  setTimeout(()=>{

    reader.classList.remove(
      "focus-effect"
    );

  },250);

  if(navigator.vibrate){

    navigator.vibrate([200,80,200]);
  }

  if(soundEnabled){

    successAudio.pause();

    successAudio.currentTime = 0;

    successAudio.play()
    .catch(()=>{});
  }

  document.body.style.background =
    "#063";

  setTimeout(()=>{

    document.body.style.background =
      "#111";

    scanBox.style.borderColor =
      "rgba(255,255,255,0.18)";

  },250);
}


function errorEffect(){

  scanBox.style.borderColor =
    "#ff4444";

  reader.classList.add("focus-effect");

  setTimeout(()=>{

    reader.classList.remove(
      "focus-effect"
    );

  },250);

  if(navigator.vibrate){

    navigator.vibrate([100,50,100]);
  }

  if(soundEnabled){

    errorAudio.pause();

    errorAudio.currentTime = 0;

    errorAudio.play()
    .catch(()=>{});
  }

  document.body.style.background =
    "#500";

  setTimeout(()=>{

    document.body.style.background =
      "#111";

    scanBox.style.borderColor =
      "rgba(255,255,255,0.18)";

  },250);
}


/* ================= DUPLICATE ================= */

function isDuplicate(code){

  const now = Date.now();

  if(
    code === lastCode
    &&
    now - lastTime < 3000
  ){
    return true;
  }

  lastCode = code;

  lastTime = now;

  return false;
}


/* ================= CAMERA ================= */

async function startCamera(cameraId){

  try{

    result.innerHTML =
      "📷 Đang mở camera...";

    if(cameraStarted){

      await html5QrCode.stop();

      cameraStarted = false;
    }

    await html5QrCode.start(

      cameraId,

      {

        fps:30,

        disableFlip:true,

        qrbox:{
          width:300,
          height:200
        },

        aspectRatio:1.777,

        videoConstraints:{
          facingMode:"environment"
        }

      },

      onScan
    );

    cameraStarted = true;

    result.innerHTML =
      "📷 Sẵn sàng quét";

  }catch(err){

    console.log(err);

    result.innerHTML =
      "❌ Không mở được camera";
  }
}


/* ================= SCAN ================= */

function onScan(decodedText){

  if(!scanning) return;

  if(isDuplicate(decodedText)) return;

  scanning = false;

  result.innerHTML =
    "⏳ Đang xử lý...";

  sendData(decodedText);
}


/* ================= SEND ================= */

let offlineQueue = JSON.parse(
  localStorage.getItem("queue") || "[]"
);

function saveQueue(){

  localStorage.setItem(
    "queue",
    JSON.stringify(offlineQueue)
  );
}


function sendData(text){

  fetch(
    "https://script.google.com/macros/s/AKfycbyo9D1Wkg_cU0L4SFMcFnU3Zu1oXkyMJnFc7xRkGflq6TlQMdv0mh3JslKoDm2UvBKW/exec?mtn="
    + encodeURIComponent(text)
  )

  .then(r=>r.json())

  .then(res=>{

    handleResult(res);

  })

  .catch(()=>{

    offlineQueue.push(text);

    saveQueue();

    errorEffect();

    result.innerHTML =
      "📶 Mất mạng - đã lưu";

    showPopup(
      "📶 Mất mạng - đã lưu",
      false
    );

    setTimeout(()=>{

      hidePopup();

      scanning = true;

      result.innerHTML =
        "📷 Sẵn sàng quét";

    },3000);
  });
}


/* ================= RESULT ================= */

function handleResult(res){

  if(res.success){

    successEffect();

    result.innerHTML =
      `✅ ${res.message}`;

    showPopup(

      `
      ✅ ${res.message}

      <br><br>

      👤 ${res.name}

      <br>

      🏫 ${res.lop}
      `,

      true
    );

  }else{

    errorEffect();

    result.innerHTML =
      `❌ ${res.message}`;

    showPopup(

      `
      ❌ ${res.message}
      `,

      false
    );
  }

  setTimeout(()=>{

    hidePopup();

    scanning = true;

    result.innerHTML =
      "📷 Sẵn sàng quét";

  },3000);
}


/* ================= SWITCH CAMERA ================= */

function switchCamera(){

  if(cameras.length < 2){

    alert("Chỉ có 1 camera");

    return;
  }

  cameraIndex++;

  if(cameraIndex >= cameras.length){

    cameraIndex = 0;
  }

  startCamera(
    cameras[cameraIndex].id
  );
}


/* ================= FLASH ================= */

async function toggleFlash(){

  try{

    const track =
      html5QrCode.getRunningTrack();

    flashOn = !flashOn;

    await track.applyConstraints({

      advanced:[{
        torch:flashOn
      }]
    });

    result.innerHTML =
      flashOn
      ? "🔦 Flash ON"
      : "🔦 Flash OFF";

  }catch(e){

    alert("❌ Máy không hỗ trợ flash");
  }
}


/* ================= OFFLINE SYNC ================= */

setInterval(()=>{

  if(!navigator.onLine) return;

  if(offlineQueue.length === 0) return;

  const item = offlineQueue.shift();

  saveQueue();

  fetch(
    "https://script.google.com/macros/s/AKfycbyo9D1Wkg_cU0L4SFMcFnU3Zu1oXkyMJnFc7xRkGflq6TlQMdv0mh3JslKoDm2UvBKW/exec?mtn="
    + encodeURIComponent(item)
  );

},5000);


/* ================= INIT ================= */

Html5Qrcode.getCameras()

.then(devices=>{

  if(devices.length === 0){

    result.innerHTML =
      "❌ Không tìm thấy camera";

    return;
  }

  cameras = devices;

  let backCamera =
    devices.find(d =>
      /back|rear|environment/i
      .test(d.label)
    );

  if(backCamera){

    cameraIndex =
      devices.indexOf(backCamera);

  }else{

    cameraIndex = 0;
  }

  startCamera(
    cameras[cameraIndex].id
  );

})

.catch(err=>{

  console.log(err);

  result.innerHTML =
    "❌ Không cấp quyền camera";
});

</script>

</body>
</html>
