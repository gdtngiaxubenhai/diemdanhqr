<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  margin:0;
}

h2{ margin:15px; }

#reader{
  width:100%;
}

#result{
  padding:20px;
  font-size:22px;
  min-height:120px;
}
</style>
</head>

<body>

<h2>📷 Điểm Danh QR</h2>

<div id="reader"></div>
<div id="result">🔄 Đang khởi động camera...</div>

<script>

const result = document.getElementById("result");

let qr = new Html5Qrcode("reader");
let scanning = true;
let cameraId = null;

// ================== BEEP ==================
function beep(ok=true){
  new Audio(
    ok
    ? "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    : "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
  ).play();
}

// ================== START CAMERA ==================
function startScanner(id){

  result.innerHTML = "📷 Đang mở camera...";

  qr.start(
    id,
    {
      fps: 12,
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0
    },
    onScan
  )
  .then(() => {
    result.innerHTML = "📷 Sẵn sàng quét";
  })
  .catch(err => {
    console.log(err);
    result.innerHTML = "❌ Không mở được camera<br><small>" + err + "</small>";
  });
}

// ================== SCAN ==================
function onScan(text){

  if(!scanning) return;

  scanning = false;
  result.innerHTML = "⏳ Đang xử lý...";

  fetch("https://script.google.com/macros/s/AKfycbw1ZFWZgAa7f75uyzMVPgrY5xUdKnfdYZhvz_wNfakdYgG6j4Hbd284tTSyjYn-2yg/exec?mtn=" + encodeURIComponent(text))
    .then(r => r.json())
    .then(res => {

      beep(res.success);

      result.innerHTML = res.success
        ? "✅ " + res.message + "<br><b>" + res.name + "</b><br>" + res.lop
        : "❌ " + res.message;

      setTimeout(() => {
        scanning = true;
        result.innerHTML = "📷 Sẵn sàng quét";
      }, 1500);

    })
    .catch(err => {

      console.log(err);

      result.innerHTML = "❌ Lỗi server";
      beep(false);

      setTimeout(() => scanning = true, 1500);
    });
}

// ================== INIT CAMERA (FIX 100%) ==================
Html5Qrcode.getCameras()
.then(devs => {

  console.log("CAMERAS:", devs);

  if(!devs || devs.length === 0){
    result.innerHTML = "❌ Không tìm thấy camera";
    return;
  }

  // ưu tiên camera sau
  let back = devs.find(d =>
    /back|rear|environment/i.test(d.label || "")
  );

  cameraId = back ? back.id : devs[0].id;

  startScanner(cameraId);

})
.catch(err => {

  console.log("CAM ERROR:", err);

  result.innerHTML =
    "❌ Không truy cập được camera<br><small>" + err + "</small>";
});

</script>

</body>
</html>
