<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

h2{
  margin-top:15px;
}

#reader{
  width:100%;
}

#result{
  font-size:24px;
  padding:15px;
  font-weight:bold;
}

button{
  padding:12px 16px;
  margin:5px;
  font-size:15px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:30px;
  border-radius:20px;
  width:80%;
  z-index:9999;
  font-size:28px;
  font-weight:bold;
  display:none;
  box-shadow:0 0 30px #000;
}

.popup-success{
  border:3px solid #00ff99;
  color:#00ff99;
}

.popup-error{
  border:3px solid #ff4444;
  color:#ff4444;
}

.show{
  animation:pop .2s ease;
}

@keyframes pop{

  from{
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
  }

  to{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}

</style>
</head>

<body>

<h2>📷 QR Điểm Danh PRO</h2>

<button onclick="enableSound()">
🔊 Bật âm thanh
</button>

<button onclick="switchCamera()">
🔄 Camera
</button>

<button onclick="toggleFlash()">
🔦 Flash
</button>

<div id="reader" style="display:none;"></div>

<button onclick="openScanner()" id="scanBtn">
📷 Bắt đầu quét
</button>

<div id="result">
📷 Sẵn sàng quét
</div>

<div id="popup"></div>

<script>

const result = document.getElementById("result");

const popup = document.getElementById("popup");

const successAudio = new Audio(
  "https://www.soundjay.com/buttons/sounds/button-09.mp3"
);

const errorAudio = new Audio(
  "https://www.soundjay.com/buttons/sounds/button-10.mp3"
);

successAudio.preload = "auto";
errorAudio.preload = "auto";

let soundEnabled = false;

let html5QrCode = new Html5Qrcode("reader");

let cameras = [];

let cameraIndex = 0;

let scanning = true;

let lastCode = "";

let lastTime = 0;

let flashOn = false;

let cameraStarted = false;

let scannerOpened = false;


// ================= SOUND =================

async function enableSound(){

  try{

    await successAudio.play();

    successAudio.pause();

    successAudio.currentTime = 0;

    await errorAudio.play();

    errorAudio.pause();

    errorAudio.currentTime = 0;

    soundEnabled = true;

    navigator.vibrate?.([200,100,200]);

    alert("✅ Đã bật âm thanh & rung");

  }catch(e){

    console.log(e);

    alert("❌ Không bật được âm thanh");
  }
}

function beep(ok=true){

  if(!soundEnabled) return;

  const audio = ok ? successAudio : errorAudio;

  audio.pause();

  audio.currentTime = 0;

  audio.play().catch(()=>{});
}

function vibrate(ok=true){

  if(!navigator.vibrate) return;

  if(ok){

    navigator.vibrate([250,100,250]);

  }else{

    navigator.vibrate([100,50,100]);
  }
}


// ================= POPUP =================

function showPopup(html, ok=true){

  popup.style.display = "block";

  popup.className = ok
    ? "popup-success"
    : "popup-error";

  popup.classList.remove("show");

  void popup.offsetWidth;

  popup.classList.add("show");

  popup.innerHTML = html;
}

function hidePopup(){

  popup.style.display = "none";
}


// ================= DUPLICATE =================

function isDuplicate(code){

  const now = Date.now();

  if(code === lastCode && now - lastTime < 3000){

    return true;
  }

  lastCode = code;

  lastTime = now;

  return false;
}
async function openScanner(){

  if(scannerOpened) return;

  scannerOpened = true;

  document.getElementById("reader").style.display = "block";

  document.getElementById("scanBtn").style.display = "none";

  if(cameras.length === 0){

    result.innerHTML =
      "❌ Không tìm thấy camera";

    return;
  }
}

// ================= START CAMERA =================

async function startCamera(cameraId){

  try{

    result.innerHTML = "📷 Đang mở camera...";

    if(cameraStarted){

      await html5QrCode.stop();

      cameraStarted = false;
    }

    await html5QrCode.start(

      cameraId,

      {
        fps:20,

        qrbox:{
          width:280,
          height:180
        },

        aspectRatio:1.777,

        videoConstraints:{
          facingMode:"environment"
        }
      },

      onScan
    );

    cameraStarted = true;

    result.innerHTML = "📷 Sẵn sàng quét";

  }catch(err){

    console.log(err);

    result.innerHTML = "❌ Không mở được camera";
  }
}


// ================= SCAN =================

function onScan(decodedText){

  if(!scanning) return;

  if(isDuplicate(decodedText)) return;

  scanning = false;

  result.innerHTML = "⏳ Đang xử lý...";

  sendData(decodedText);
}


// ================= SEND =================

let offlineQueue = JSON.parse(
  localStorage.getItem("queue") || "[]"
);

function saveQueue(){

  localStorage.setItem(
    "queue",
    JSON.stringify(offlineQueue)
  );
}

function sendData(text){

  fetch(
    "https://script.google.com/macros/s/AKfycbyo9D1Wkg_cU0L4SFMcFnU3Zu1oXkyMJnFc7xRkGflq6TlQMdv0mh3JslKoDm2UvBKW/exec?mtn="
    + encodeURIComponent(text)
  )

  .then(r => r.json())

  .then(res => {

    handleResult(res);

  })

  .catch(() => {

    offlineQueue.push(text);

    saveQueue();

    result.innerHTML =
      "📶 Mất mạng - đã lưu";

    beep(false);

    vibrate(false);

    resetScan();
  });
}


// ================= RESULT =================

function handleResult(res){

  beep(res.success);

  vibrate(res.success);

  if(res.success){

    document.body.style.background =
      "#008855";

    result.innerHTML =
      `✅ ${res.message}`;

    showPopup(

      `
      ✅ ${res.message}

      <br><br>

      👤 ${res.name}

      <br>

      🏫 ${res.lop}
      `,

      true
    );

  }else{

    document.body.style.background =
      "#880000";

    result.innerHTML =
      `❌ ${res.message}`;

    showPopup(

      `
      ❌ ${res.message}
      `,

      false
    );
  }

  setTimeout(()=>{

    document.body.style.background =
      "#111";

  },200);

  resetScan();
}


// ================= RESET =================

function resetScan(){

  setTimeout(()=>{

    hidePopup();

    scanning = true;

    result.innerHTML =
      "📷 Sẵn sàng quét";

  },1500);
}


// ================= SWITCH CAMERA =================

function switchCamera(){

  if(cameras.length < 2){

    alert("Chỉ có 1 camera");

    return;
  }

  cameraIndex++;

  if(cameraIndex >= cameras.length){

    cameraIndex = 0;
  }

  startCamera(cameras[cameraIndex].id);
}


// ================= FLASH =================

async function toggleFlash(){

  try{

    const track =
      html5QrCode.getRunningTrack();

    flashOn = !flashOn;

    await track.applyConstraints({
      advanced:[{
        torch:flashOn
      }]
    });

    result.innerHTML =
      flashOn
      ? "🔦 Flash ON"
      : "🔦 Flash OFF";

  }catch(e){

    alert("❌ Máy không hỗ trợ flash");
  }
}


// ================= OFFLINE AUTO SYNC =================

setInterval(()=>{

  if(!navigator.onLine) return;

  if(offlineQueue.length === 0) return;

  const item = offlineQueue.shift();

  saveQueue();

  fetch(
    "https://script.google.com/macros/s/AKfycbyo9D1Wkg_cU0L4SFMcFnU3Zu1oXkyMJnFc7xRkGflq6TlQMdv0mh3JslKoDm2UvBKW/exec?mtn="
    + encodeURIComponent(item)
  );

},5000);


// ================= INIT =================

Html5Qrcode.getCameras()

.then(devices => {

  if(devices.length === 0){

    result.innerHTML =
      "❌ Không tìm thấy camera";

    return;
  }

  cameras = devices;

  let backCamera =
    devices.find(d =>
      /back|rear|environment/i.test(d.label)
    );

  if(backCamera){

    cameraIndex =
      devices.indexOf(backCamera);

  }else{

    cameraIndex = 0;
  }

  startCamera(
    cameras[cameraIndex].id
  );

})

.catch(err => {

  console.log(err);

  result.innerHTML =
    "❌ Không cấp quyền camera";
});

</script>

</body>
</html>
