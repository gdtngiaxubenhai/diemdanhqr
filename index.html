<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  margin:0;
}

h2{
  margin:15px;
}

#reader{
  width:100%;
}

#result{
  padding:20px;
  font-size:24px;
  min-height:120px;
}
button{
  padding:10px 14px;
  margin:5px;
  font-size:15px;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>📷 Điểm Danh QR</h2>

<div id="reader"></div>

<div id="result">Đang mở camera...</div>

<script>

const result = document.getElementById("result");

let qr = new Html5Qrcode("reader");

let scanning = true;
let lastCode = "";
let lastTime = 0;

let cameras = [];
let cameraIndex = 0;

// ================== BEEP ==================
function beep(ok=true){
  new Audio(
    ok
    ? "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    : "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
  ).play();
}

// ================== DUPLICATE ==================
function isDuplicate(code){
  const now = Date.now();
  if(code === lastCode && now - lastTime < 3000) return true;
  lastCode = code;
  lastTime = now;
  return false;
}

// ================== START CAMERA ==================
async function startCamera(id){

  try{
    if(qr.isScanning){
      await qr.stop();
      await qr.clear();
    }

    await qr.start(
      id,
      {
        fps: 15,
        qrbox: { width: 280, height: 280 },
        aspectRatio: 1.0
      },
      onScan
    );

  }catch(e){
    console.log(e);
    result.innerHTML = "❌ Camera lỗi: " + e;
  }
}

// ================== SCAN ==================
function onScan(text){

  if(!scanning) return;
  if(isDuplicate(text)) return;

  scanning = false;
  result.innerHTML = "⏳ Đang xử lý...";

  fetch("YOUR_SCRIPT_URL?mtn=" + encodeURIComponent(text))
    .then(r => r.json())
    .then(res => {

      beep(res.success);

      result.innerHTML = res.success
        ? "✅ " + res.message + "<br><b>" + res.name + "</b><br>" + res.lop
        : "❌ " + res.message;

      setTimeout(() => {
        scanning = true;
        result.innerHTML = "📷 Sẵn sàng quét";
      }, 1500);

    })
    .catch(err => {
      result.innerHTML = "❌ Lỗi server: " + err;
      beep(false);

      setTimeout(() => {
        scanning = true;
      }, 1500);
    });
}

// ================== INIT CAMERA ==================
Html5Qrcode.getCameras().then(devs => {

  cameras = devs;

  // ưu tiên camera sau
  let back = devs.find(d =>
    /back|rear|environment/i.test(d.label)
  );

  cameraIndex = back ? devs.indexOf(back) : devs.length - 1;

  startCamera(cameras[cameraIndex].id);

});

// ================== SWITCH CAMERA (OPTIONAL) ==================
function switchCamera(){

  if(cameras.length < 2){
    alert("Chỉ có 1 camera");
    return;
  }

  cameraIndex = (cameraIndex + 1) % cameras.length;

  startCamera(cameras[cameraIndex].id);

  result.innerHTML = "🔄 Đang đổi camera...";
}

</script>

</body>
</html>
