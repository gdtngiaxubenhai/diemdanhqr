<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

h2{
  margin-top:15px;
}

#reader{
  width:100%;
}

#result{
  font-size:24px;
  padding:15px;
  font-weight:bold;
}

button{
  padding:12px 16px;
  margin:5px;
  font-size:15px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:30px;
  border-radius:20px;
  width:80%;
  z-index:9999;
  font-size:28px;
  font-weight:bold;
  display:none;
  box-shadow:0 0 30px #000;
}

.popup-success{
  border:3px solid #00ff99;
  color:#00ff99;
}

.popup-error{
  border:3px solid #ff4444;
  color:#ff4444;
}

.show{
  animation:pop .2s ease;
}

@keyframes pop{

  from{
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
  }

  to{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}

</style>
</head>

<body>

<h2>📷 QR Điểm Danh PRO</h2>

<button onclick="enableSound()">
🔊 Bật âm thanh
</button>

<button onclick="switchCamera()">
🔄 Camera
</button>

<button onclick="toggleFlash()">
🔦 Flash
</button>

<div id="reader"></div>

<div id="result">
📷 Sẵn sàng quét
</div>

<div id="popup"></div>

<script>

const result = document.getElementById("result");
const popup = document.getElementById("popup");

const successAudio = new Audio(
  "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
);

const errorAudio = new Audio(
  "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

successAudio.preload = "auto";
errorAudio.preload = "auto";

let html5QrCode = new Html5Qrcode("reader");

let cameras = [];
let cameraIndex = 0;
let scanning = true;
let processing = false;
let lastCode = "";
let lastTime = 0;
let flashOn = false;
let cameraStarted = false;


// ================= EFFECT =================

function successEffect(){

  // rung
  if(navigator.vibrate){

    navigator.vibrate([200,80,200]);
  }

  // beep
  if(soundEnabled){

    successAudio.pause();

    successAudio.currentTime = 0;

    const playPromise =
      successAudio.play();

    if(playPromise !== undefined){

      playPromise.catch(err=>{

        console.log(err);
      });
    }
  }

  // flash nền
  document.body.style.background = "#063";

  setTimeout(()=>{

    document.body.style.background = "#111";

  },150);
}

function errorEffect(){

  // rung
  if(navigator.vibrate){

    navigator.vibrate([100,80,100]);
  }

  // beep
  if(soundEnabled){

    errorAudio.pause();

    errorAudio.currentTime = 0;

    const playPromise =
      errorAudio.play();

    if(playPromise !== undefined){

      playPromise.catch(err=>{

        console.log(err);
      });
    }
  }

  // flash nền
  document.body.style.background = "#500";

  setTimeout(()=>{

    document.body.style.background = "#111";

  },200);
}


// ================= POPUP =================

function showPopup(html, ok=true){

  popup.style.display = "block";

  popup.className =
    ok
    ? "popup-success show"
    : "popup-error show";

  popup.innerHTML = html;
}

function hidePopup(){

  popup.style.display = "none";
}


// ================= DUPLICATE =================

function isDuplicate(code){

  const now = Date.now();

  if(code === lastCode && now - lastTime < 3000){

    return true;
  }

  lastCode = code;
  lastTime = now;

  return false;
}


// ================= CAMERA =================

async function startCamera(cameraId){

  try{

    result.innerHTML = "📷 Đang mở camera...";

    if(cameraStarted){

      await html5QrCode.stop();

      cameraStarted = false;
    }

    await html5QrCode.start(

      cameraId,

      {
        fps:20,

        qrbox:{
          width:280,
          height:180
        },

        aspectRatio:1.777,

        videoConstraints:{
          facingMode:"environment"
        }
      },

      onScan
    );

    cameraStarted = true;

    result.innerHTML = "📷 Sẵn sàng quét";

  }catch(err){

    console.log(err);

    result.innerHTML =
      "❌ Không mở được camera";
  }
}


// ================= SCAN =================
function onScan(decodedText){

  if(!scanning) return;

  if(processing) return;

  if(isDuplicate(decodedText)) return;

  processing = true;

  scanning = false;

  // rung ngay lúc bắt QR
  if(navigator.vibrate){

    navigator.vibrate(120);
  }

  result.innerHTML =
    `
    ⏳ ĐANG XỬ LÝ...

    <br><br>

    📦 ${decodedText}
    `;

  sendData(decodedText);
}

// ================= SEND =================

function sendData(text){

  fetch(
    "https://script.google.com/macros/s/AKfycbyo9D1Wkg_cU0L4SFMcFnU3Zu1oXkyMJnFc7xRkGflq6TlQMdv0mh3JslKoDm2UvBKW/exec?mtn="
    + encodeURIComponent(text)
  )

  .then(r => r.json())

  .then(res => {

    handleResult(res);

  })

  .catch(err => {

    console.log(err);

    result.innerHTML =
      "📶 Mất mạng";

    errorEffect();

    setTimeout(()=>{

  hidePopup();

  scanning = true;

  processing = false;

  result.innerHTML =
    "📷 Sẵn sàng quét";

},3000);

  });

}


// ================= RESULT =================

function handleResult(res){

  if(res.success){

    successEffect();

    result.innerHTML =
      `✅ ${res.message}`;

    showPopup(

      `
      ✅ ${res.message}

      <br><br>

      👤 ${res.name}

      <br>

      🏫 ${res.lop}
      `,

      true
    );

  }else{

    errorEffect();

    result.innerHTML =
      `❌ ${res.message}`;

    showPopup(

      `
      ❌ ${res.message}
      `,

      false
    );
  }

  setTimeout(()=>{

    hidePopup();

    scanning = true;

    result.innerHTML =
      "📷 Sẵn sàng quét";

  },3000);
}


// ================= SWITCH CAMERA =================

function switchCamera(){

  if(cameras.length < 2){

    alert("Chỉ có 1 camera");

    return;
  }

  cameraIndex++;

  if(cameraIndex >= cameras.length){

    cameraIndex = 0;
  }

  startCamera(cameras[cameraIndex].id);
}


// ================= FLASH =================

async function toggleFlash(){

  try{

    const track =
      html5QrCode.getRunningTrack();

    flashOn = !flashOn;

    await track.applyConstraints({
      advanced: [{
        torch: flashOn
      }]
    });

    result.innerHTML =
      flashOn
      ? "🔦 Flash ON"
      : "🔦 Flash OFF";

  }catch(e){

    alert("❌ Máy không hỗ trợ flash");
  }
}


// ================= INIT =================

Html5Qrcode.getCameras()

.then(devices => {

  if(devices.length === 0){

    result.innerHTML =
      "❌ Không tìm thấy camera";

    return;
  }

  cameras = devices;

  let backCamera =
    devices.find(d =>
      /back|rear|environment/i.test(d.label)
    );

  if(backCamera){

    cameraIndex =
      devices.indexOf(backCamera);

  }else{

    cameraIndex = 0;
  }

  startCamera(
    cameras[cameraIndex].id
  );

})

.catch(err => {

  console.log(err);

  result.innerHTML =
    "❌ Không cấp quyền camera";
});

</script>

</body>
</html>
