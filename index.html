<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

#reader{ width:100%; }

#result{
  font-size:24px;
  padding:15px;
}

button{
  padding:10px 14px;
  margin:6px;
  font-size:15px;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>📷 QR Điểm Danh PRO</h2>

<button onclick="switchCamera()">🔄 Camera</button>
<button onclick="toggleFlash()">🔦 Flash</button>

<div id="reader"></div>
<div id="result">Sẵn sàng quét</div>

<script>

const result = document.getElementById("result");

let qr = new Html5Qrcode("reader");

let cameras = [];
let cameraIndex = 0;

let scanning = true;
let lastCode = "";
let lastTime = 0;

let flashOn = false;

// ================== OFFLINE QUEUE ==================
let offlineQueue = JSON.parse(localStorage.getItem("queue") || "[]");

function saveQueue(){
  localStorage.setItem("queue", JSON.stringify(offlineQueue));
}

// ================== BEEP + VIBRATE ==================
function beep(ok=true){
  new Audio(
    ok
    ? "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    : "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
  ).play();
}

function vibrate(){
  if(navigator.vibrate) navigator.vibrate(150);
}

// ================== DUPLICATE FILTER ==================
function isDuplicate(code){
  const now = Date.now();
  if(code === lastCode && now - lastTime < 3000){
    return true;
  }
  lastCode = code;
  lastTime = now;
  return false;
}

// ================== START CAMERA ==================
async function startCamera(id){

  try{
    if(qr.isScanning){
      await qr.stop();
      await qr.clear();
    }

    await qr.start(
      id,
      {
        fps: 12,        // ⚡ nhanh hơn
        qrbox: 260
      },
      onScan
    );

  }catch(e){
    console.log(e);
    result.innerHTML = "❌ Camera lỗi";
  }
}

// ================== SCAN ==================
function onScan(text){

  if(!scanning) return;
  if(isDuplicate(text)) return;

  scanning = false;
  result.innerHTML = "⏳ Đang xử lý...";

  sendData(text);

}

// ================== SEND (ONLINE/OFFLINE) ==================
function sendData(text){

  fetch("YOUR_SCRIPT_URL?mtn=" + encodeURIComponent(text))
  .then(r => r.json())
  .then(res => {

    handleResult(res);

  })
  .catch(() => {

    // ❌ OFFLINE → lưu queue
    offlineQueue.push(text);
    saveQueue();

    result.innerHTML = "📶 Mất mạng - đã lưu lại";
    beep(false);
    vibrate();

    resetScan();
  });
}

// ================== HANDLE RESULT ==================
function handleResult(res){

  beep(res.success);
  vibrate();

  result.innerHTML = res.success
    ? `✅ ${res.message}<br><b>${res.name}</b><br>${res.lop}`
    : `❌ ${res.message}`;

  resetScan();
}

// ================== RESET ==================
function resetScan(){
  setTimeout(() => {
    scanning = true;
    result.innerHTML = "📷 Sẵn sàng quét";
  }, 1200);
}

// ================== CAMERA INIT (AUTO BACK CAMERA) ==================
Html5Qrcode.getCameras().then(devs => {

  cameras = devs;

  // ưu tiên camera sau
  let back = devs.find(d =>
    /back|rear|environment/i.test(d.label)
  );

  cameraIndex = back ? devs.indexOf(back) : devs.length - 1;

  startCamera(cameras[cameraIndex].id);
});

// ================== SWITCH CAMERA ==================
function switchCamera(){

  if(cameras.length < 2){
    alert("Chỉ có 1 camera");
    return;
  }

  cameraIndex = (cameraIndex + 1) % cameras.length;

  startCamera(cameras[cameraIndex].id);

  result.innerHTML = "🔄 Đang đổi camera...";
}

// ================== FLASH (BEST EFFORT) ==================
async function toggleFlash(){

  try{
    const track = qr.getRunningTrack?.();

    if(!track){
      alert("Chưa mở camera");
      return;
    }

    flashOn = !flashOn;

    await track.applyConstraints({
      advanced: [{ torch: flashOn }]
    });

    result.innerHTML = flashOn ? "🔦 Flash ON" : "🔦 Flash OFF";

  }catch(e){
    alert("Thiết bị không hỗ trợ flash");
  }
}

// ================== AUTO SYNC OFFLINE QUEUE ==================
setInterval(() => {

  if(offlineQueue.length === 0) return;
  if(!navigator.onLine) return;

  const item = offlineQueue.shift();
  saveQueue();

  fetch("YOUR_SCRIPT_URL?mtn=" + encodeURIComponent(item));

}, 5000);

</script>

</body>
</html>
