<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

#reader{
  width:100%;
}

#result{
  font-size:28px;
  padding:20px;
}

button{
  padding:10px 15px;
  margin:8px;
  font-size:16px;
  border-radius:8px;
}
</style>

</head>

<body>

<h1>📷 Điểm Danh QR</h1>

<button onclick="switchCamera()">🔄 Đổi camera</button>
<button onclick="toggleFlash()">🔦 Flash</button>

<div id="reader"></div>
<div id="result">Sẵn sàng quét</div>

<script>

const result = document.getElementById("result");

let qr = new Html5Qrcode("reader");

let cameras = [];
let cameraIndex = 0;
let currentCameraId = null;
let scanning = true;

// ================== beep ==================
function beep(ok=true){
  const audio = new Audio(
    ok
    ? "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    : "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
  );
  audio.play();
}

// ================== vibrate ==================
function vibrate(){
  if(navigator.vibrate) navigator.vibrate(150);
}

// ================== START CAMERA SAFE ==================
async function startCamera(cameraId){

  try{
    if(qr.isScanning){
      await qr.stop();
      await qr.clear();
    }

    await qr.start(
      cameraId,
      {
        fps: 10,
        qrbox: 250
      },
      onScanSuccess
    );

    currentCameraId = cameraId;

  }catch(e){
    console.log(e);
    result.innerHTML = "❌ Lỗi camera";
  }
}

// ================== SCAN ==================
function onScanSuccess(text){

  if(!scanning) return;
  scanning = false;

  result.innerHTML = "⏳ Đang xử lý...";

  fetch("YOUR_SCRIPT_URL?mtn=" + encodeURIComponent(text))
  .then(r => r.json())
  .then(res => {

    vibrate();

    beep(res.success);

    result.innerHTML =
      res.success
      ? `<div style="color:#00ff99">${res.message}</div><b>${res.name}</b><br>${res.lop}`
      : `<div style="color:#ff6666">${res.message}</div>`;

    setTimeout(() => {
      scanning = true;
      result.innerHTML = "📷 Sẵn sàng quét";
    }, 1500);

  });
}

// ================== LOAD CAMERA ==================
Html5Qrcode.getCameras().then(devs => {

  cameras = devs;

  // ưu tiên camera sau
  let back = devs.find(d =>
    /back|rear|environment/i.test(d.label)
  );

  cameraIndex = back ? devs.indexOf(back) : devs.length - 1;

  startCamera(devs[cameraIndex].id);
});

// ================== SWITCH CAMERA FIX ==================
function switchCamera(){

  if(cameras.length < 2){
    alert("Chỉ có 1 camera");
    return;
  }

  cameraIndex = (cameraIndex + 1) % cameras.length;

  startCamera(cameras[cameraIndex].id);

  result.innerHTML = "🔄 Đang đổi camera...";
}

</script>

</script>

</body>
</html>
