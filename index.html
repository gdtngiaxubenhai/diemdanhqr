<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

h2{
  margin-top:15px;
}

#reader{
  width:100%;
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:#000;
}

#result{
  font-size:24px;
  padding:15px;
  font-weight:bold;
}

button{
  padding:12px 16px;
  margin:5px;
  font-size:15px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:30px;
  border-radius:20px;
  width:80%;
  z-index:9999;
  font-size:28px;
  font-weight:bold;
  display:none;
  box-shadow:0 0 30px #000;
}

.popup-success{
  border:3px solid #00ff99;
  color:#00ff99;
}

.popup-error{
  border:3px solid #ff4444;
  color:#ff4444;
}

.show{
  animation:pop .2s ease;
}

@keyframes pop{

  from{
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
  }

  to{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}
.scan-box{

  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:85%;
  height:180px;

  border:3px solid rgba(255,255,255,0.25);

  border-radius:20px;

  z-index:999;
  pointer-events:none;
}


/* 4 góc */

.scan-box::before,
.scan-box::after{

  content:"";

  position:absolute;

  width:40px;
  height:40px;

  border-color:#00ff99;

  border-style:solid;
}

.scan-box::before{

  top:-3px;
  left:-3px;

  border-width:4px 0 0 4px;

  border-radius:20px 0 0 0;
}

.scan-box::after{

  bottom:-3px;
  right:-3px;

  border-width:0 4px 4px 0;

  border-radius:0 0 20px 0;
}


/* laser đỏ */

.scan-line{

  position:absolute;

  left:50%;

  top:50%;

  transform:translateX(-50%);

  width:82%;
  height:3px;

  background:red;

  box-shadow:
    0 0 10px red,
    0 0 20px red;

  z-index:1000;

  animation:laser 2s linear infinite;
}


@keyframes laser{

  0%{
    top:20%;
  }

  50%{
    top:75%;
  }

  100%{
    top:20%;
  }
}
</style>
</head>

<body>

<h2>📷 QR Điểm Danh PRO</h2>

<button onclick="enableSound()">
🔊 Bật âm thanh
</button>

<button onclick="switchCamera()">
🔄 Camera
</button>

<button onclick="toggleFlash()">
🔦 Flash
</button>

<div id="reader">

  <div class="scan-box"></div>

  <div class="scan-line"></div>

</div>

<div id="result">
📷 Sẵn sàng quét
</div>

<div id="popup"></div>

<script>

const result = document.getElementById("result");

const popup = document.getElementById("popup");

const successAudio = new Audio(
  "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
);

const errorAudio = new Audio(
  "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

// preload
successAudio.load();
errorAudio.load();

successAudio.preload = "auto";
errorAudio.preload = "auto";

let soundEnabled = false;

let html5QrCode = new Html5Qrcode("reader");

let cameras = [];

let cameraIndex = 0;

let scanning = true;

let lastCode = "";

let lastTime = 0;

let flashOn = false;

let cameraStarted = false;


// ================= SOUND =================

async function enableSound(){

  try{

    await successAudio.play();

    successAudio.pause();

    successAudio.currentTime = 0;

    await errorAudio.play();

    errorAudio.pause();

    errorAudio.currentTime = 0;

    soundEnabled = true;

    if(navigator.vibrate){

      navigator.vibrate([200,100,200]);
    }

    alert("✅ Đã bật âm thanh & rung");

  }catch(err){

    console.log(err);

    alert("❌ Trình duyệt chặn âm thanh");
  }
}

// ================= POPUP =================

function showPopup(html, ok=true){

  popup.style.display = "block";

  popup.className = ok
    ? "popup-success"
    : "popup-error";

  popup.classList.remove("show");

  void popup.offsetWidth;

  popup.classList.add("show");

  popup.innerHTML = html;
}

function hidePopup(){

  popup.style.display = "none";
}
function successEffect(){
  document.querySelector(".scan-box")
.style.borderColor = "#00ff99";
  document.getElementById("reader")
.style.transform = "scale(1.03)";
  if(navigator.vibrate){

    navigator.vibrate([200,80,200]);
  }

  successAudio.pause();

  successAudio.currentTime = 0;

  const playPromise =
    successAudio.play();

  if(playPromise !== undefined){

    playPromise.catch(err=>{

      console.log(err);
    });
  }

  document.body.style.background = "#063";

  setTimeout(()=>{

    document.body.style.background = "#111";

  },150);
}


function errorEffect(){

  if(navigator.vibrate){

    navigator.vibrate([100,80,100]);
  }

  errorAudio.pause();

  errorAudio.currentTime = 0;

  const playPromise =
    errorAudio.play();

  if(playPromise !== undefined){

    playPromise.catch(err=>{

      console.log(err);
    });
  }

  document.body.style.background = "#500";

  setTimeout(()=>{

    document.body.style.background = "#111";

  },200);
}

// ================= DUPLICATE =================

function isDuplicate(code){

  const now = Date.now();

  if(code === lastCode && now - lastTime < 3000){

    return true;
  }

  lastCode = code;

  lastTime = now;

  return false;
}


// ================= START CAMERA =================

async function startCamera(cameraId){

  try{

    result.innerHTML = "📷 Đang mở camera...";

    if(cameraStarted){

      await html5QrCode.stop();

      cameraStarted = false;
    }

    await html5QrCode.start(

      cameraId,

      {
        fps:30,
        disableFlip:true,
        qrbox:{
          width:280,
          height:180
        },

        aspectRatio:1.777,

        videoConstraints:{
          facingMode:"environment"
        }
      },

      onScan
    );

    cameraStarted = true;

    result.innerHTML = "📷 Sẵn sàng quét";

  }catch(err){

    console.log(err);

    result.innerHTML = "❌ Không mở được camera";
  }
}


// ================= SCAN =================

function onScan(decodedText){

  if(!scanning) return;

  if(isDuplicate(decodedText)) return;

  scanning = false;

  result.innerHTML = "⏳ Đang xử lý...";

  sendData(decodedText);
}


// ================= SEND =================

let offlineQueue = JSON.parse(
  localStorage.getItem("queue") || "[]"
);

function saveQueue(){

  localStorage.setItem(
    "queue",
    JSON.stringify(offlineQueue)
  );
}

function sendData(text){

  fetch(
    "https://script.google.com/macros/s/AKfycbyo9D1Wkg_cU0L4SFMcFnU3Zu1oXkyMJnFc7xRkGflq6TlQMdv0mh3JslKoDm2UvBKW/exec?mtn="
    + encodeURIComponent(text)
  )

  .then(r => r.json())

  .then(res => {

    handleResult(res);

  })

  .catch(() => {

    offlineQueue.push(text);

    saveQueue();

    result.innerHTML =
      "📶 Mất mạng - đã lưu";

    errorEffect();

setTimeout(()=>{

  scanning = true;

  result.innerHTML =
    "📷 Sẵn sàng quét";

},3000);


// ================= RESULT =================

function handleResult(res){

  if(res.success){

    successEffect();

    result.innerHTML =
      `
      ✅ ${res.message}
      `;

    showPopup(
      `
      ✅ ${res.message}

      <br><br>

      👤 ${res.name}

      <br>

      🏫 ${res.lop}
      `,
      true
    );

  }else{

    errorEffect();

    result.innerHTML =
      `
      ❌ ${res.message}
      `;

    showPopup(
      `
      ❌ ${res.message}
      `,
      false
    );
  }

  // dừng 3 giây
  setTimeout(()=>{

    hidePopup();

    scanning = true;

    result.innerHTML =
      "📷 Sẵn sàng quét";

  },3000);
}





// ================= SWITCH CAMERA =================

function switchCamera(){

  if(cameras.length < 2){

    alert("Chỉ có 1 camera");

    return;
  }

  cameraIndex++;

  if(cameraIndex >= cameras.length){

    cameraIndex = 0;
  }

  startCamera(cameras[cameraIndex].id);
}


// ================= FLASH =================

async function toggleFlash(){

  try{

    const track =
      html5QrCode.getRunningTrack();

    flashOn = !flashOn;

    await track.applyConstraints({
      advanced:[{
        torch:flashOn
      }]
    });

    result.innerHTML =
      flashOn
      ? "🔦 Flash ON"
      : "🔦 Flash OFF";

  }catch(e){

    alert("❌ Máy không hỗ trợ flash");
  }
}


// ================= OFFLINE AUTO SYNC =================

setInterval(()=>{

  if(!navigator.onLine) return;

  if(offlineQueue.length === 0) return;

  const item = offlineQueue.shift();

  saveQueue();

  fetch(
    "https://script.google.com/macros/s/AKfycbyo9D1Wkg_cU0L4SFMcFnU3Zu1oXkyMJnFc7xRkGflq6TlQMdv0mh3JslKoDm2UvBKW/exec?mtn="
    + encodeURIComponent(item)
  );

},5000);


// ================= INIT =================

Html5Qrcode.getCameras()

.then(devices => {

  if(devices.length === 0){

    result.innerHTML =
      "❌ Không tìm thấy camera";

    return;
  }

  cameras = devices;

  let backCamera =
    devices.find(d =>
      /back|rear|environment/i.test(d.label)
    );

  if(backCamera){

    cameraIndex =
      devices.indexOf(backCamera);

  }else{

    cameraIndex = 0;
  }

  startCamera(
    cameras[cameraIndex].id
  );

})

.catch(err => {

  console.log(err);

  result.innerHTML =
    "❌ Không cấp quyền camera";
});

</script>

</body>
</html>
